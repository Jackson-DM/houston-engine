name: Signal Hunter Ingestion

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours
    - cron: '17 */6 * * *'

concurrency:
  group: signal-hunter-run
  cancel-in-progress: false

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests PyYAML

      - name: Run Signal Ingestion
        env:
          MAX_INGESTION_PER_RUN: 5
        run: python automation/scripts/ingest_signal_hunter.py

      - name: Run Signal Scoring
        run: python automation/scripts/score_signals.py

      - name: Run Insight Extraction
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SIGNAL_INSIGHT_MODEL: "google/gemini-3.1-flash-lite-preview"
          MIN_CANDIDATE_SCORE_FOR_INSIGHTS: 60
        run: python automation/scripts/extract_signal_insights.py

      - name: Run Content Generation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONTENT_GEN_MODEL: "google/gemini-3.1-flash-lite-preview"
          MAX_DRAFTS_PER_RUN: 1
          MIN_INSIGHT_CONFIDENCE_FOR_DRAFTS: 0.70
        run: python automation/scripts/generate_authority_drafts.py

      - name: Run Content Humanization
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUMANIZER_MODEL: "google/gemini-3.1-flash-lite-preview"
          MAX_HUMANIZATION_PER_RUN: 2
        run: python automation/scripts/humanize_authority_drafts.py

      - name: Run Keyword Watchlist Scanner
        working-directory: automation/scripts
        env:
          PYTHONPATH: automation/scripts
        run: python keyword_watchlist.py
        continue-on-error: true

      - name: Check API Budget
        run: |
          python -c "
          import json, sys
          with open('automation/logs/latest-run-summary.json') as f:
              s = json.load(f)
          w = s.get('budget_warning')
          if w:
              print(f'::warning::BUDGET WARNING — {w[\"message\"]} ({w[\"pct_used\"]}% of \$20 budget used)')
          "

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add directory changes
          git add signals/raw/ signals/scored/ signals/archive/ signals/insights/ content/drafts/ content/final/ automation/state/ automation/logs/
          
          # Safe commit
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "chore(signal-hunter): automated signal run summary $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
