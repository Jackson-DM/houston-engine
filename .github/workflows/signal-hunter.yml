name: Signal Hunter Ingestion

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours at minute 17 (avoiding top-of-hour congestion)
    - cron: '17 */6 * * *'

# Ensure only one run happens at a time to prevent state conflicts
concurrency:
  group: signal-hunter-run
  cancel-in-progress: false

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for pushing back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for reliable git status

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests PyYAML

      - name: Run Signal Ingestion
        run: python automation/scripts/ingest_signal_hunter.py

      - name: Run Signal Scoring
        run: python automation/scripts/score_signals.py

      - name: Run Insight Extraction
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SIGNAL_INSIGHT_MODEL: "google/gemini-2.0-flash-001"
        run: python automation/scripts/extract_signal_insights.py

      - name: Run Content Generation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONTENT_GEN_MODEL: "google/gemini-2.0-flash-001"
        run: python automation/scripts/generate_authority_drafts.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Only add specific directory changes for safety
          git add signals/raw/ signals/scored/ signals/archive/ signals/insights/ content/drafts/ automation/state/ automation/logs/
          
          # Check if there's anything to commit
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "chore(signal-hunter): automated signal ingestion run $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
